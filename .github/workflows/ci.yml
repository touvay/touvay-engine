name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Fetch pinned llama.cpp source
        shell: pwsh
        run: ./scripts/fetch-llamacpp.ps1

      # `build` runs assembly, all JVM/Robolectric unit tests, Android lint, the
      # ARCHITECTURE.md §8 dependency-rules check, and binary API compatibility
      # (apiCheck) — all wired into `check`.
      - name: Build, test, verify dependency rules and API compatibility
        run: ./gradlew build

  connected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Fetch pinned llama.cpp source
        shell: pwsh
        run: ./scripts/fetch-llamacpp.ps1

      # Cross-process binder tests (apps/demo androidTest): the one layer Robolectric
      # cannot exercise.
      - name: Run connected tests on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :apps:demo:connectedDebugAndroidTest
